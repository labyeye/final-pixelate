  <body>
    <script src="https://www.pixelatenest.com/js/chatbot.js" defer></script>

    <div
      id="landing-contact-modal"
      class="landing-contact-modal"
      aria-hidden="true"
    >
      <div class="landing-contact-backdrop" data-close-modal="true"></div>
      <div
        class="landing-contact-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="landing-contact-title"
      >
        <button
          type="button"
          class="landing-contact-close"
          id="landing-contact-close"
          aria-label="Close contact form"
        >
          &times;
        </button>
        <h3 id="landing-contact-title">Let's Discuss Your Project</h3>
        <p class="landing-contact-subtitle">
          Quick details share kar dijiye, team aapse jaldi connect karegi.
        </p>
        <form id="landing-contact-form" class="landing-contact-form" novalidate>
          <div class="landing-contact-grid">
            <input type="text" name="name" placeholder="Your Name" required />
            <input
              type="email"
              name="Email-Address"
              placeholder="Email Address"
              required
            />
            <input
              type="tel"
              name="Phone"
              placeholder="Phone Number"
              required
            />
            <input
              type="text"
              name="Enter-your-subject"
              placeholder="Subject"
              required
            />
            <select name="field" required>
              <option value="" disabled selected>Select Project Type</option>
              <option value="Website Development">Website Development</option>
              <option value="App Development">App Development</option>
              <option value="Software Development">Software Development</option>
              <option value="Video Editing">Video Editing</option>
              <option value="Digital Marketing">Digital Marketing</option>
              <option value="Other">Other</option>
            </select>
            <select name="budget">
              <option value="" disabled selected>Select Budget</option>
              <option value="Below 25k">Below 25k</option>
              <option value="25k - 50k">25k - 50k</option>
              <option value="50k - 1L">50k - 1L</option>
              <option value="1L+">1L+</option>
            </select>
          </div>
          <textarea
            name="Message"
            rows="4"
            placeholder="Tell us about your requirement"
            required
          ></textarea>
          <input type="hidden" name="selected-plan" value="" />
          <div class="landing-contact-actions">
            <input type="submit" value="Submit" />
          </div>
          <p
            class="landing-contact-success"
            id="landing-contact-success"
            hidden
          >
            Thanks! Your enquiry has been submitted successfully.
          </p>
          <p class="landing-contact-error" id="landing-contact-error" hidden>
            Something went wrong. Please try again.
          </p>
        </form>
      </div>
    </div>

    <style>
      .landing-contact-modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        padding: 16px;
        box-sizing: border-box;
      }
      .landing-contact-modal.is-open {
        display: flex;
      }
      .landing-contact-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.62);
      }
      .landing-contact-dialog {
        position: relative;
        width: min(92vw, 720px);
        background: #fff;
        border-radius: 16px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        max-height: 88vh;
        overflow: auto;
      }
      .landing-contact-close {
        position: absolute;
        top: 10px;
        right: 12px;
        border: 0;
        background: transparent;
        font-size: 32px;
        line-height: 1;
        cursor: pointer;
        color: #333;
      }
      .landing-contact-dialog h3 {
        margin: 0;
        font-size: 28px;
        color: #0f172a;
      }
      .landing-contact-subtitle {
        margin: 8px 0 18px;
        color: #475569;
        font-size: 15px;
      }
      .landing-contact-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .landing-contact-form input,
      .landing-contact-form select,
      .landing-contact-form textarea {
        width: 100%;
        border: 1px solid #d4d4d8;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 14px;
        font-family: inherit;
        box-sizing: border-box;
      }
      .landing-contact-form textarea {
        margin-top: 12px;
        resize: vertical;
      }
      .landing-contact-actions {
        margin-top: 14px;
      }
      .landing-contact-actions input[type="submit"] {
        border: 0;
        background: #0f4ea8;
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .landing-contact-actions input[type="submit"]:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .landing-contact-success {
        color: #15803d;
        margin: 10px 0 0;
        font-size: 13px;
      }
      .landing-contact-error {
        color: #b91c1c;
        margin: 10px 0 0;
        font-size: 13px;
      }
      body.modal-open {
        overflow: hidden;
      }
      @media (max-width: 767px) {
        .landing-contact-dialog {
          padding: 20px;
        }
        .landing-contact-dialog h3 {
          font-size: 22px;
        }
        .landing-contact-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>

    <script>
      (function () {
        var modal = document.getElementById("landing-contact-modal");
        var closeBtn = document.getElementById("landing-contact-close");
        var form = document.getElementById("landing-contact-form");
        var successEl = document.getElementById("landing-contact-success");
        var errorEl = document.getElementById("landing-contact-error");
        if (!modal || !closeBtn || !form) return;
        function openModal() {
          modal.classList.add("is-open");
          modal.setAttribute("aria-hidden", "false");
          document.body.classList.add("modal-open");
        }
        function closeModal() {
          modal.classList.remove("is-open");
          modal.setAttribute("aria-hidden", "true");
          document.body.classList.remove("modal-open");
        }
        var MODAL_KEY = "pn_discuss_last_shown";
        var ONE_HOUR = 60 * 60 * 1000;
        var lastShown = parseInt(localStorage.getItem(MODAL_KEY) || "0", 10);
        if (Date.now() - lastShown >= ONE_HOUR) {
          setTimeout(function () {
            openModal();
            localStorage.setItem(MODAL_KEY, String(Date.now()));
          }, 700);
        }
        closeBtn.addEventListener("click", closeModal);
        modal.addEventListener("click", function (e) {
          if (e.target && e.target.getAttribute("data-close-modal") === "true")
            closeModal();
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && modal.classList.contains("is-open"))
            closeModal();
        });
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          if (successEl) successEl.hidden = true;
          if (errorEl) errorEl.hidden = true;
          var submitButton = form.querySelector('input[type="submit"]');
          if (!submitButton) return;
          submitButton.value = "Sending...";
          submitButton.disabled = true;
          var formData = new FormData(form);
          var data = {
            name: formData.get("name"),
            email: formData.get("Email-Address"),
            phone: formData.get("Phone"),
            subject: formData.get("Enter-your-subject"),
            projectType: formData.get("field"),
            message: formData.get("Message"),
            selectedPlan: formData.get("selected-plan"),
            budget: formData.get("budget"),
          };
          var API_BASE =
            window.DASHBOARD_API_BASE && window.DASHBOARD_API_BASE.trim()
              ? window.DASHBOARD_API_BASE.replace(/\/$/, "")
              : "";
          fetch((API_BASE || "") + "/api/enquiries", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          })
            .then(function (r) {
              if (!r.ok) throw new Error("Failed");
              return r.json();
            })
            .then(function () {
              fetch((API_BASE || "") + "/api/send-email", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify(data),
              }).catch(function () {});
              form.reset();
              if (successEl) successEl.hidden = false;
              setTimeout(closeModal, 1100);
            })
            .catch(function () {
              if (errorEl) errorEl.hidden = false;
            })
            .finally(function () {
              submitButton.value = "Submit";
              submitButton.disabled = false;
            });
        });
      })();
    </script>
