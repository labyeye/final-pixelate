    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script>
      (function () {
        var el = document.getElementById("book"),
          pages = el.querySelectorAll(".page"),
          N = pages.length;
        function size() {
          var m = document.querySelector("main"),
            h = Math.min(window.innerHeight - 170, 1100),
            w = m.clientWidth - 32,
            pw = Math.round(h * 0.707),
            ph = h;
          if (w <= 700) {
            pw = Math.min(w, pw);
            ph = Math.round(pw / 0.707);
          } else if (pw * 2 > w) {
            pw = Math.floor(w / 2);
            ph = Math.round(pw / 0.707);
          }
          return { w: pw, h: ph };
        }
        var s = size();
        var pf = new St.PageFlip(el, {
          width: s.w,
          height: s.h,
          size: "fixed",
          showCover: true,
          usePortrait: true,
          mobileScrollSupport: false,
          maxShadowOpacity: 0.5,
          flippingTime: 700,
        });
        function load(i) {
          for (var k = Math.max(0, i - 2); k <= Math.min(N - 1, i + 5); k++) {
            var im = pages[k].querySelector("img");
            if (im && !im.src) im.src = im.getAttribute("data-src");
          }
        }
        pf.loadFromHTML(pages);
        load(0);
        function upd() {
          var i = pf.getCurrentPageIndex();
          load(i);
          document.getElementById("pos").textContent = i + 1 + " / " + N;
        }
        pf.on("flip", upd);
        document.getElementById("prev").onclick = function () {
          pf.flipPrev();
        };
        document.getElementById("next").onclick = function () {
          pf.flipNext();
        };
        document.getElementById("full").onclick = function () {
          var d = document.documentElement;
          document.fullscreenElement
            ? document.exitFullscreen()
            : d.requestFullscreen && d.requestFullscreen();
        };
        document.addEventListener("keydown", function (e) {
          if (e.key === "ArrowRight") pf.flipNext();
          if (e.key === "ArrowLeft") pf.flipPrev();
        });
      })();
    </script>
