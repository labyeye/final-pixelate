    <script>
      
      async function loadPhotoGalleries() {
        try {
          
          const res = await fetch(
            "https://backend.pixelatenest.com/api/photos",
          );
          let galleries = [];
          if (res.ok) {
            const json = await res.json();
            
            if (
              Array.isArray(json) &&
              json.length &&
              (json[0].thumbnailBase64 || json[0].thumbnail || json[0].url)
            ) {
              galleries = [{ brandName: "All Photos", entries: json }];
            } else {
              galleries = json;
            }
          } else {
            console.warn(
              "Deployed API returned",
              res.status,
              "– falling back to local sample",
            );
            const local = await fetch("./photo-galleries-sample.json");
            galleries = local.ok ? await local.json() : [];
          }

          const grid = document.getElementById("portfolio-grid");
          if (!grid) return;
          grid.innerHTML = "";

          
          const photos = [];
          galleries.forEach((g) => {
            const entries = Array.isArray(g.entries) ? g.entries : [];
            entries.forEach((e) => photos.push(e));
          });

          if (!photos || photos.length === 0) {
            grid.innerHTML =
              '<p class="p-text-01 text-white-60">No photos available right now.</p>';
            return;
          }

          
          
          photos.forEach((p, idx) => {
            const card = document.createElement("div");
            
            
            let forceLarge = false;
            if (p.height === 3 || p.height === "3") forceLarge = true;
            else if (p.height == null) {
              
              forceLarge = Math.random() < 0.24;
              
              if (!forceLarge && idx % 8 === 0 && Math.random() < 0.5)
                forceLarge = true;
            }

            const sizeClass = forceLarge ? "size-large" : "size-small";
            card.className = `portfolio-card ${sizeClass}`;

            const img = document.createElement("img");
            img.className = "portfolio-image";
            img.alt = p.title || "Photo";
            img.loading = "lazy";
            img.src =
              p.thumbnailBase64 ||
              p.thumbnail ||
              p.url ||
              "/assets/placeholder.png";

            
            img.addEventListener("load", () => card.classList.add("loaded"));

            card.appendChild(img);
            grid.appendChild(card);
          });
        } catch (err) {
          console.error("Failed to load photos", err);
        }
      }

      if (
        document.readyState === "complete" ||
        document.readyState === "interactive"
      ) {
        setTimeout(loadPhotoGalleries, 300);
      } else {
        document.addEventListener("DOMContentLoaded", loadPhotoGalleries);
      }

      
      (function initMosaicControls() {
        const range = document.getElementById("radiusRange");
        const valSpan = document.getElementById("radiusValue");
        const grid = document.getElementById("portfolio-grid");
        if (!range || !valSpan) return;
        
        const apply = (v) => {
          document.documentElement.style.setProperty(
            "--portfolio-radius",
            v + "px",
          );
          valSpan.textContent = v + "px";
        };
        
        apply(range.value || "0");
        range.addEventListener("input", (e) => {
          apply(e.target.value);
        });
      })();
    </script>
