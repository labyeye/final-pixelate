<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Client Portal | Pixelate Nest</title>
    <style>
      :root {
        --bg: #0b0b0c;
        --card: #111113;
        --line: #2a2a2c;
        --gold: #c9a24b;
        --ink: #f5f0e6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        min-height: 100vh;
      }
      .gate {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .brand {
        letter-spacing: 0.4em;
        font-size: 12px;
        color: var(--gold);
      }
      h1 {
        font-weight: 300;
        font-size: clamp(2rem, 6vw, 3.5rem);
        margin: 20px 0 32px;
      }
      h1 b {
        font-weight: 300;
        color: var(--gold);
      }
      #code {
        background: none;
        border: 0;
        border-bottom: 2px solid var(--gold);
        color: var(--ink);
        font-size: 2rem;
        letter-spacing: 0.3em;
        text-align: center;
        width: 100%;
        max-width: 340px;
        padding: 8px;
        outline: none;
      }
      .btn {
        background: var(--gold);
        color: #000;
        border: 0;
        padding: 14px 40px;
        letter-spacing: 0.2em;
        font-size: 13px;
        cursor: pointer;
        margin-top: 28px;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      #err {
        color: #f87171;
        font-size: 14px;
        margin-top: 12px;
        min-height: 20px;
      }
      #app {
        display: none;
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 20px 140px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        flex-wrap: wrap;
        gap: 20px;
        margin-bottom: 32px;
      }
      .top h2 {
        font-weight: 300;
        font-size: clamp(1.6rem, 4vw, 2.6rem);
      }
      .prog {
        min-width: 240px;
      }
      .prog div.t {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-bottom: 8px;
      }
      .bar {
        height: 2px;
        background: #222;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--gold);
      }
      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--line);
        margin-bottom: 28px;
      }
      .tab {
        background: none;
        border: 0;
        color: var(--ink);
        opacity: 0.55;
        padding: 12px 18px;
        cursor: pointer;
        letter-spacing: 0.15em;
        font-size: 12px;
        text-transform: uppercase;
        border-bottom: 2px solid transparent;
      }
      .tab.on {
        opacity: 1;
        border-color: var(--gold);
        color: var(--gold);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 18px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        cursor: pointer;
        transition:
          transform 0.3s,
          border-color 0.3s;
        text-align: left;
        color: inherit;
        padding: 0;
        font: inherit;
      }
      .card:hover {
        transform: translateY(-4px);
      }
      .card.on {
        border-color: var(--gold);
        box-shadow: 0 0 0 1px var(--gold);
      }
      .thumb {
        height: 170px;
        background: #1a1a1c center/cover;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.6rem;
      }
      .pal {
        display: flex;
        height: 170px;
      }
      .pal i {
        flex: 1;
      }
      .meta {
        padding: 14px 16px;
        display: flex;
        justify-content: space-between;
        font-size: 14px;
      }
      .meta em {
        color: var(--gold);
        font-style: normal;
        font-size: 12px;
        letter-spacing: 0.15em;
      }
      .empty {
        opacity: 0.5;
        padding: 40px 0;
      }
      .bottom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(11, 11, 12, 0.96);
        border-top: 1px solid var(--line);
        padding: 14px 20px;
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        backdrop-filter: blur(8px);
      }
      .sum {
        font-size: 13px;
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
      }
      .sum span b {
        color: var(--gold);
        font-weight: 400;
      }
      .done {
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <div class="gate" id="gate">
      <p class="brand">PIXELATE NEST</p>
      <h1>Your project, <b>your way.</b></h1>
      <input
        id="code"
        placeholder="PN-XXXXXX"
        maxlength="12"
        autocomplete="off"
        autofocus
      />
      <p id="err"></p>
      <button class="btn" id="enter">ENTER</button>
    </div>

    <div id="app">
      <div class="top">
        <div>
          <p class="brand">PIXELATE NEST</p>
          <h2 id="title"></h2>
        </div>
        <div class="prog" id="prog"></div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="grid" id="grid"></div>
    </div>
    <div class="bottom" id="bottom" style="display: none">
      <div class="sum" id="sum"></div>
      <button class="btn" id="submit" style="margin: 0">
        CONFIRM &amp; SUBMIT
      </button>
    </div>

    <script>
      const API = "https://backend.pixelatenest.com/api/portal";
      const LABEL = {
        template: "Templates",
        stack: "Tech stack",
        palette: "Colours",
        font: "Typography",
      };
      let code = "",
        data = null,
        sel = {},
        tab = "";
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const safeColor = (c) =>
        /^#[0-9a-f]{3,8}$/i.test(c.trim()) ? c.trim() : "#333";
      const safeUrl = (u) =>
        /^(https?:)?\/\//i.test(u) || u.startsWith("/") ? u : "";

      async function call(body) {
        try {
          const r = await fetch(API, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          return { ok: r.ok, d: await r.json() };
        } catch {
          return { ok: false, d: { error: "Network error. Please retry." } };
        }
      }

      async function open(c) {
        $("err").textContent = "";
        $("enter").disabled = true;
        const { ok, d } = await call({ code: c });
        $("enter").disabled = false;
        if (!ok)
          return ($("err").textContent = d.error || "Something went wrong");
        code = c;
        data = d;
        sel = d.selections || {};
        tab = d.sections.includes("template") ? "template" : d.sections[0];
        $("gate").style.display = "none";
        $("app").style.display = "block";
        history.replaceState(null, "", location.pathname); // don't leave the pass in the URL
        loadFonts();
        render();
      }

      function loadFonts() {
        data.assets
          .filter((a) => a.type === "font")
          .forEach((a) => {
            const l = document.createElement("link");
            l.rel = "stylesheet";
            l.href =
              "https://fonts.googleapis.com/css2?family=" +
              encodeURIComponent(a.preview) +
              "&display=swap";
            document.head.appendChild(l);
          });
      }

      function render() {
        const p = data.project;
        $("title").textContent = p ? p.title : "Your project";
        $("prog").innerHTML = p
          ? `<div class="t"><span>${esc(p.status)}</span><span>${+p.progress}%</span></div><div class="bar"><i style="width:${+p.progress}%"></i></div>${p.deliveryDate ? `<p style="font-size:12px;opacity:.6;margin-top:8px">Delivery: ${esc(String(p.deliveryDate).slice(0, 10))}</p>` : ""}`
          : "";
        const secs = ["template", "stack", "palette", "font"].filter((s) =>
          data.sections.includes(s),
        );
        $("tabs").innerHTML = secs
          .map(
            (s) =>
              `<button class="tab ${s === tab ? "on" : ""}" data-t="${s}">${LABEL[s]}${sel[s] ? " ✓" : ""}</button>`,
          )
          .join("");
        const items = data.assets.filter((a) => a.type === tab);
        $("grid").innerHTML = items.length
          ? items.map(cardHtml).join("")
          : `<p class="empty">Nothing here yet.</p>`;
        $("bottom").style.display = secs.length ? "flex" : "none";
        $("sum").innerHTML = secs
          .map((s) => `<span>${LABEL[s]}: <b>${esc(nameOf(s))}</b></span>`)
          .join("");
        const b = $("submit");
        if (data.submitted) {
          b.style.display = "none";
          $("sum").insertAdjacentHTML(
            "beforeend",
            `<span class="done">Submitted — thank you, our team has your choices.</span>`,
          );
        } else {
          b.style.display = "";
          b.disabled = !secs.every((s) => sel[s]);
        }
      }

      const nameOf = (t) =>
        (data.assets.find((a) => a.id === sel[t]) || {}).name || "—";

      function cardHtml(a) {
        let v;
        if (a.type === "palette")
          v = `<div class="pal">${a.preview
            .split(",")
            .map((c) => `<i style="background:${safeColor(c)}"></i>`)
            .join("")}</div>`;
        else if (a.type === "font")
          v = `<div class="thumb" style="font-family:'${esc(a.preview)}'">Aa Bb Cc</div>`;
        else
          v = `<div class="thumb" style="background-image:url('${esc(safeUrl(a.preview))}')">${a.preview ? "" : "◇"}</div>`;
        const on = sel[a.type] === a.id;
        return `<button class="card ${on ? "on" : ""}" data-id="${esc(a.id)}" data-type="${a.type}">${v}<div class="meta"><span>${esc(a.name)}</span><em>${on ? "SELECTED" : ""}</em></div></button>`;
      }

      $("grid").addEventListener("click", (e) => {
        const c = e.target.closest(".card");
        if (!c || data.submitted) return;
        sel[c.dataset.type] = c.dataset.id;
        render();
        call({ code, selections: sel });
      });
      $("tabs").addEventListener("click", (e) => {
        const t = e.target.dataset.t;
        if (t) {
          tab = t;
          render();
        }
      });
      $("submit").addEventListener("click", async () => {
        $("submit").disabled = true;
        const { ok, d } = await call({ code, selections: sel, submit: true });
        if (ok) {
          data = d;
          render();
        } else {
          alert(d.error || "Failed, please retry.");
          $("submit").disabled = false;
        }
      });
      $("enter").addEventListener("click", () =>
        open($("code").value.trim().toUpperCase()),
      );
      $("code").addEventListener(
        "keydown",
        (e) => e.key === "Enter" && $("enter").click(),
      );
      const q = new URLSearchParams(location.search).get("c");
      if (q) open(q.toUpperCase());
    </script>
  </body>
</html>
