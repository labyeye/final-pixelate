    <script>
      (function () {
        if (
          localStorage.getItem("pn_prefetch_optout") === "1" ||
          document.cookie.indexOf("pn_prefetch_optout=1") !== -1
        )
          return;
        const pages = [
          "/about.html",
          "/webdev.html",
          "/app-dev.html",
          "/software-dev.html",
          "/video-ed.html",
          "/photography.html",
          "/blogs.html",
          "/pricing.html",
          "/careers.html",
          "/index.html",
        ];
        const domains = [
          "https://backend.pixelatenest.com",
          "https://fonts.googleapis.com",
          "https://fonts.gstatic.com",
          "https://cdn.prod.website-files.com",
          "https://cdnjs.cloudflare.com",
          "https://www.google-analytics.com",
          "https://www.googletagmanager.com",
        ];
        function addLink(rel, href, as, crossorigin) {
          try {
            const l = document.createElement("link");
            l.rel = rel;
            l.href = href;
            if (as) l.as = as;
            if (crossorigin) l.crossOrigin = "anonymous";
            document.head.appendChild(l);
          } catch (e) {}
        }
        function warm() {
          domains.forEach((d) => {
            addLink("preconnect", d, null, true);
            addLink("dns-prefetch", d);
          });
          pages.forEach((p) => addLink("prefetch", p, "document"));
          addLink("preload", "/styles.css", "style");
          addLink(
            "preload",
            "https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css",
            "style",
            true,
          );
          try {
            fetch("/", {
              method: "GET",
              mode: "no-cors",
              cache: "no-cache",
            }).catch(() => {});
            fetch("https://backend.pixelatenest.com", {
              method: "GET",
              mode: "no-cors",
            }).catch(() => {});
          } catch (e) {}
        }
        if ("requestIdleCallback" in window)
          requestIdleCallback(warm, { timeout: 2000 });
        else window.addEventListener("load", () => setTimeout(warm, 1000));
        window.pixelateNestDisablePrefetch = function () {
          localStorage.setItem("pn_prefetch_optout", "1");
          document.cookie =
            "pn_prefetch_optout=1;path=/;max-age=" + 60 * 60 * 24 * 365;
        };
        window.pixelateNestEnablePrefetch = function () {
          localStorage.removeItem("pn_prefetch_optout");
          document.cookie = "pn_prefetch_optout=;path=/;max-age=0";
        };
      })();
    </script>
