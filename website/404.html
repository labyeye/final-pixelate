<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>
      404 - Page Not Found | Return to Pixelate Nest — Creative Digital Agency
      for Video, Web & App Services
    </title>
    <meta
      name="description"
      content="The page you're looking for doesn't exist."
    />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src-elem 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self';"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="robots" content="noindex, nofollow" />

    <div class="error-page-wrapper">
      <video
        class="video-bg"
        autoplay
        muted
        loop
        playsinline
        poster="./assets/404-poster.jpg"
      >
        <source src="./assets/404animation.mp4" type="video/mp4" />
      </video>
    </div>
  </head>
</html>
