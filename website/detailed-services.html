<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting... | Pixelate Nest</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var service = params.get("service") || "";

        var serviceMap = {
          "web-development": "/services/web-development.html",
          "app-development": "/services/app-development.html",
          "software-development": "/services/software-development.html",
          "video-editing": "/services/video-editing.html",
          "digital-marketing": "/services/digital-marketing.html",
          uiux: "/services/uiux-branding.html",
          "uiux-branding": "/services/uiux-branding.html",
          hosting: "/services/hosting-maintenance.html",
          "hosting-maintenance": "/services/hosting-maintenance.html",
        };

        var destination =
          service && serviceMap[service]
            ? serviceMap[service]
            : "/services/index.html";
        window.location.replace(destination);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to the correct page&hellip;</p>
  </body>
</html>
